<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music player</title>
    <link rel="stylesheet" href="css/utility.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container flex bg-black">
      <!-- Left Sidebar -->
      <div class="left">
        <div class="close">
          <img width="30"class="invert"src="img/close.svg">
        </div>
        <!-- Home Section -->
        <div class="home rounded bg-grey m-1 p-1">
          <div class="logo">
            <img class="invert" width="100"src="img/logo.svg" alt="Logo" />
          </div>
          <ul>
            <li><img class="invert" src="img/home.svg" alt="Home Icon" /> home</li>
            <li>
              <img class="invert" src="img/search.svg" alt="Search Icon" /> search
            </li>
          </ul>
        </div>

        <!-- Library Section -->
        <div class="library rounded bg-grey m-1 p-1">
          <div class="heading">
            <img class="invert" src="img/playlist.svg" alt="Playlist Icon" />
            <h2>Your Library</h2>
            
          </div>
          <div class="songList">
            <ul>
              
            </ul>
          </div>
          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>PrivacyCenter</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                ><span>PrivacyPolicy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                ><span>AboutAds</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
        <!--   footer  -->
      </div>

      <!-- Right Content Area -->
      <div class="right bg-grey rounded">
        <div class="header">
          <div class="nav">
           <div class="hamburgercontainer">
              <img width="60" height="60"class="hamburger invert"src="img/menu-01-stroke-rounded.svg">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                  stroke="#ffffff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                  stroke="#ffffff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            
            </div>
          </div>
          <div class="button">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
         
        </div>
        </div>
        <div class="spotifyplaylists">
          <h1>Spofity Playlist</h1>
          <div class="cardcontainer">
           
            
          </div>
          <div class="playbar">
            <div class="seekbar">
              <div class="circle"></div>
            </div>
            <div class="abovebar">
            <div class="songinfo"></div>
            <div class="songbutton">
              <img width="35"id="previous"src="img/prevsong.svg">
              <img width="35"id="play"src="img/play.svg">
              <img width="35"id="next"src="img/nextsong.svg">
            </div>
            <div class="timevol">
            <div class="songtime">

            </div>
            <div class="volume">
              <img width="25"src="img/volume-high-stroke-rounded.svg">
              <div class="range">
                <input type="range" name="volume" id="">
              </div>
            </div>
          </div>
          </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
